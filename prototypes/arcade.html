<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life File — Five Years in Karsen</title>
<style>
:root{--paper:#f6f0e3;--ink:#242d29;--muted:#68716a;--green:#315d4d;--line:#dcd5c5;--red:#a34736;--gold:#ad7435}*{box-sizing:border-box}body{margin:0;background:#e8e2d6;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:15px}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.48}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}main{max-width:1040px;margin:auto;padding:24px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bbb5a7;padding-bottom:14px}.wordmark{font-size:18px;letter-spacing:4px;font-weight:850}.small{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.ghost{border:1px solid #bbb5a7;background:transparent;border-radius:5px;padding:8px 12px;color:var(--muted)}.hero{display:grid;grid-template-columns:1fr 260px;align-items:end;gap:20px;padding:25px 0 20px}h1{font:normal 42px/1.08 Georgia,serif;margin:8px 0 12px;letter-spacing:-1px}p{line-height:1.55;margin:7px 0}.sub{color:var(--muted);max-width:510px}.city{height:120px;width:100%;color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:20px}.stats{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:15px;margin-bottom:20px}.stat{border-right:1px solid var(--line);padding-right:12px}.stat:last-child{border:0}.value{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.track{height:5px;background:#dedfd5;border-radius:4px;overflow:hidden;margin-top:7px}.track i{display:block;height:100%;background:var(--green);transition:width .25s}.track.red i{background:var(--red)}.sectionline{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionline h2{font-size:16px;margin:0}.dots{display:flex;gap:5px}.dot{width:11px;height:11px;border-radius:50%;background:#d7d8ce}.dot.on{background:var(--green)}#feedback{background:#e6ede4;border-left:3px solid var(--green);border-radius:3px;padding:11px 13px;margin:16px 0;font-size:14px;min-height:60px}#feedback.bad{background:#f2e3dc;border-color:var(--red)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.action{position:relative;text-align:left;padding:14px;border:1px solid var(--line);border-radius:6px;background:#fffaf0;color:var(--ink);min-height:101px;transition:background .13s,transform .13s}.action:not(:disabled):hover{background:#e9eddf;transform:translateY(-2px)}.action b{font-size:16px;display:block;margin-bottom:5px}.action span{display:block;font-size:12px;line-height:1.5;color:var(--muted)}.action .cost{position:absolute;right:12px;top:14px;font-size:10px;letter-spacing:1px;color:var(--green)}.action.risk{grid-column:1/-1;background:#f2e6d8;border-color:#d9be9c}.end{width:100%;margin-top:15px;border:0;border-radius:5px;background:var(--green);color:white;padding:14px;font-weight:700}.hint{font-size:12px;color:var(--muted);text-align:center;margin:9px 0 0}.profile{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}.avatar{width:48px;height:48px;border-radius:50%;background:#ddd8c7;display:grid;place-items:center;font:24px Georgia,serif;color:var(--green)}.profile b{font-size:17px}.block{padding:17px 0;border-bottom:1px solid var(--line)}.block:last-child{border:0;padding-bottom:0}.block h3{font-size:13px;margin:0 0 8px}.block p{font-size:12px;color:var(--muted)}.inline{display:flex;justify-content:space-between;font-size:13px;margin:6px 0}.steps{display:flex;gap:5px;margin:9px 0}.steps i{flex:1;height:7px;border-radius:2px;background:#dedfd5}.steps i.on{background:var(--green)}.chip{display:inline-block;padding:4px 7px;background:#e5e9dd;border-radius:3px;color:var(--green);font-size:11px;margin-top:5px}.goal{display:flex;align-items:center;gap:8px;font-size:12px;margin:9px 0}.check{width:15px;height:15px;border:1px solid #9daba0;border-radius:3px;flex-shrink:0;text-align:center;line-height:14px;font-size:11px}.check.yes{background:var(--green);color:white}.record{margin-top:20px}.record h2{font-size:13px;letter-spacing:1px;text-transform:uppercase}.entry{font-size:12px;color:var(--muted);padding:8px 0;border-top:1px solid var(--line);line-height:1.5}.entry strong{color:var(--ink)}.overlay{position:fixed;inset:0;background:#182c25b8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay[hidden]{display:none}.dialog{background:var(--paper);border-radius:10px;padding:27px;max-width:460px;width:100%;max-height:90dvh;overflow:auto;box-shadow:0 20px 80px #11251f55}.dialog h2{font:28px/1.2 Georgia,serif;margin:8px 0 13px}.dialog p{font-size:14px}.choices{display:grid;gap:9px;margin-top:20px}.choice{text-align:left;border:1px solid #b8c5b4;background:#e6ecdf;border-radius:5px;padding:12px;color:var(--ink)}.choice b{display:block;margin-bottom:4px}.choice span{font-size:12px;color:var(--muted);line-height:1.4;display:block}.choice.alt{background:transparent;border-color:var(--line)}.bigmoney{font:46px Georgia,serif;color:var(--green);margin:15px 0}.receipt{background:#e6e8dc;padding:13px;border-radius:5px;margin:13px 0}.receipt .inline{margin:8px 0}.mobileintro{display:none}.flash{animation:flash .35s ease}@keyframes flash{50%{background:#d4e0c7}}@media(max-width:720px){main{padding:17px 14px 45px}.hero{grid-template-columns:1fr;padding-top:22px}.city{display:none}h1{font-size:34px}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.profile{grid-column:1/-1}.block{padding:14px 0}.block:last-child{border-top:1px solid var(--line);padding:14px 0 0;grid-column:1/-1}.panel{padding:16px}.stats{gap:10px}.value{font-size:23px}.record{margin-top:12px}.small{font-size:10px}.dialog{padding:22px}.hero .sub{font-size:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.city-pulse{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;background:#fff6d8;border:1px solid #e1c983;border-radius:5px;padding:10px 12px;margin:13px 0;font-size:13px}.city-pulse b{color:#795528}.city-pulse span{color:#514f42;line-height:1.4}
.year-receipt{margin:12px 0;padding:10px 12px;background:#e4e9de;border:1px solid #bad0bb;border-radius:5px;display:flex;flex-direction:column;gap:4px;font-size:12px}.year-receipt[hidden]{display:none}.year-receipt strong{font-size:13px}
.action kbd{display:inline-block;background:#edf1e7;border:1px solid #cbd4c6;border-radius:3px;font:11px system-ui,sans-serif;padding:1px 5px;margin-right:5px;vertical-align:2px}
</style>
</head>
<body><main>
<header class="top"><div class="wordmark">LIFE FILE</div><button class="ghost" id="restart">New file</button></header>
<section class="hero"><div><div class="small">Karsen / a playable mechanics sketch</div><h1>Five years.<br>A life of your own.</h1><p class="sub">Get qualified. Build a friendship. Save $650.<br>Three actions each year. Every choice costs something.</p></div>
<svg class="city" viewBox="0 0 280 130" fill="none" aria-hidden="true"><path d="M0 122H280M14 121V66L38 50L62 66V121M22 83H31M42 83H51M22 100H31M42 100H51M71 121V41H125V121M82 57H92M104 57H114M82 75H92M104 75H114M82 93H92M104 93H114M137 121V75L165 59L189 74L214 58V121M146 92H156M170 92H180M196 92H205M222 121V29H235V121M249 121V14H260V121" stroke="currentColor" stroke-width="2"/><path d="M224 20C211 11 230 7 215 0M251 6C243 2 249-2 241-6" stroke="currentColor" stroke-width="2"/><path d="M1 127H278" stroke="currentColor" stroke-width="5"/></svg></section>
<div class="layout"><section class="panel"><div class="stats" id="stats"></div>
<div class="sectionline"><h2 id="yearLabel"></h2><div class="dots" id="dots" aria-label="Actions remaining"></div></div>
<div class="city-pulse" id="cityPulse" role="note"></div><div id="feedback" role="status" aria-live="polite"></div><div id="yearReceipt" class="year-receipt" aria-live="polite" hidden></div>
<div class="actions" id="actions"></div><button class="end" id="endYear">End the year →</button><p class="hint" id="hint"></p>
</section><aside class="panel sidebar" id="sidebar"></aside></div>
<section class="record"><h2>The recent record</h2><div id="record"></div></section>
</main><div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" id="dialog"></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id), money=n=>'$'+n.toLocaleString('en-US'), clamp=n=>Math.max(0,Math.min(100,n));
let s,modal=false,lastFocus;
function reset(){s={year:1,ap:3,cash:180,health:76,mood:62,bond:42,study:0,trained:false,helped:false,promise:null,promiseDone:false,used:[],op:null,heat:0,records:[],ended:false,seed:51962,receipt:null,feedback:'You are 22. The foundry pays the bills. What you do after the shift is yours.',bad:false};modal=false;$('overlay').hidden=true;render();}
function rng(){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
function salary(){return (s.trained?560:420)+(s.helped?30:0);}

const CITY_PULSES=[
  {title:'Foundry rush',description:'Extra shifts pay $40 more, but cost 2 additional health.',workBonus:40,workStrain:2,tuitionDiscount:0,rentExtra:0,bondBonus:0,riskPenalty:0},
  {title:'Training grant',description:'Evening-class tuition is $20 cheaper this year.',workBonus:0,workStrain:0,tuitionDiscount:20,rentExtra:0,bondBonus:0,riskPenalty:0},
  {title:'Housing squeeze',description:'Rent and food cost $45 more at year end. Budget forecast includes it.',workBonus:0,workStrain:0,tuitionDiscount:0,rentExtra:45,bondBonus:0,riskPenalty:0},
  {title:'Neighborhood festival',description:'Time with Mara builds 8 additional bond points this year.',workBonus:0,workStrain:0,tuitionDiscount:0,rentExtra:0,bondBonus:8,riskPenalty:0},
  {title:'Bureau inspections',description:'Initial off-book deliveries have 20 percentage points lower success odds.',workBonus:0,workStrain:0,tuitionDiscount:0,rentExtra:0,bondBonus:0,riskPenalty:.20}
];
function pulse(){return CITY_PULSES[s.year-1];}
function workPay(){return (s.trained?130:90)+pulse().workBonus;}
function workStrain(){return 6+pulse().workStrain;}
function learnCost(){return 35-pulse().tuitionDiscount;}
function livingCost(){return 380+pulse().rentExtra;}
function connectGain(){return 12+pulse().bondBonus;}
function firstRiskOdds(){return .85-pulse().riskPenalty;}
function budget(){return salary()-livingCost();}
function add(text,bad=false){s.feedback=text;s.bad=bad;s.records.unshift({year:s.year,text});s.records=s.records.slice(0,12);}
function ready(id){return !modal&&!s.ended&&s.ap>0&&!s.used.includes(id);}
function spend(id){s.ap--;s.used.push(id);}
function checkGoals(){return [s.cash>=650,s.trained,s.bond>=65];}
function render(){
 $('stats').innerHTML=`<div class="stat"><div class="small">Cash</div><div class="value">${money(s.cash)}</div><div style="font-size:11px;color:var(--muted)">Year end ${budget()>=0?'+':'−'}${money(Math.abs(budget()))} net</div></div><div class="stat"><div class="small">Health</div><div class="value">${s.health}<small style="font-size:12px;font-weight:400"> / 100</small></div><div class="track ${s.health<35?'red':''}"><i style="width:${s.health}%"></i></div></div><div class="stat"><div class="small">Happiness</div><div class="value">${s.mood}<small style="font-size:12px;font-weight:400"> / 100</small></div><div class="track"><i style="width:${s.mood}%"></i></div></div>`;
 $('yearLabel').textContent=`${1961+s.year} / Year ${s.year} of 5`;$('dots').innerHTML=[0,1,2].map(i=>`<i class="dot ${i<s.ap?'on':''}"></i>`).join('');$('dots').setAttribute('aria-label',s.ap+' of 3 actions remaining');
 $('feedback').textContent=s.feedback;$('feedback').className=s.bad?'bad':'';
 $('cityPulse').innerHTML='<b>'+pulse().title+'</b><span>'+pulse().description+'</span>';
 $('yearReceipt').hidden=!s.receipt;
 if(s.receipt){
  const r=s.receipt;
  $('yearReceipt').innerHTML='<strong>'+(1961+r.year)+' filed</strong><span>Salary +'+money(r.income)+'; rent & food −'+money(r.costs)+(r.opMoney?'; envelope +'+money(r.opMoney):'')+'; net '+(r.net>=0?'+':'−')+money(Math.abs(r.net))+'. Cash '+money(r.cash)+'.'+(r.broken?' Promise broken: Mara −18 bond.':'')+'</span>';
 }
 const promiseDue=s.promise&&s.promise.due===s.year;
 const buttons=[['work','Work','Take an extra shift',`+${money(workPay())} / −${workStrain()} health, −3 happiness`,!ready('work')||s.health<15],['learn','Learn',s.trained?'Qualified fitter':`Evening class ${s.study}/3`,s.trained?'Your qualification now raises your salary.':`−${money(learnCost())} / one step toward a better job`,!ready('learn')||s.trained||s.cash<35],['connect','Connect',promiseDue?'Keep your promise to Mara':'Spend time with Mara',promiseDue?'Help her move / +20 bond / opens a job lead':`+${connectGain()} bond, +6 happiness / a person who remembers`,!ready('connect')],['recover','Recover','Take a proper day off','+16 health, +10 happiness / no cash cost',!ready('recover')],['risk','Take a risk',s.op?`Envelope waiting: ${money(s.op.pot)}`:'An errand off the books',s.op?'Cash out freely or spend an action to continue.':`Stake $40 / ${Math.round(firstRiskOdds()*100)}% for $90 / failure loses the stake`,s.ended||modal||(!s.op&&(s.ap<1||s.used.includes('risk')||s.cash<40))]];
 $('actions').innerHTML=buttons.map(([id,title,desc,note,disabled],i)=>`<button class="action ${id==='risk'?'risk':''}" data-action="${id}" aria-keyshortcuts="${i+1}" ${disabled?'disabled':''}><b><kbd>${i+1}</kbd>${title}</b><div class="cost">${id==='risk'&&s.op?'OPEN':'1 ACTION'}</div><span style="color:var(--ink)">${desc}</span><span>${note}</span></button>`).join('');
 $('endYear').disabled=modal||s.ended;$('endYear').textContent=s.year===5?'Finish the chapter →':'End the year →';$('hint').textContent=s.ended?'The chapter is filed. Start a new file to try another approach.':s.ap?'Keys 1–5 select actions; Enter ends the year. Salary and bills settle automatically.':'No actions left. Time to settle the year.';
 const goals=checkGoals();
 $('sidebar').innerHTML=`<div class="profile"><div class="avatar">EK</div><div><b>Elias Kovacs</b><div class="small" style="margin-top:4px">Age ${21+s.year} / Eisenmark</div></div></div><div class="block"><h3>Your ambition: a stable future</h3>${['Save $650','Qualify for a skilled job','Build a friendship: bond 65'].map((g,i)=>`<div class="goal"><span class="check ${goals[i]?'yes':''}">${goals[i]?'✓':''}</span>${g}</div>`).join('')}</div><div class="block"><h3>${s.trained?'Skilled fitter':'Foundry assistant'}</h3><div class="inline"><span>Annual salary</span><b>${money(salary())}</b></div><div class="inline"><span>Rent & food</span><b>−${money(livingCost())}</b></div><div class="steps">${[0,1,2].map(i=>`<i class="${s.study>i?'on':''}"></i>`).join('')}</div><p>${s.trained?'Qualification complete. Higher pay is automatic.':`${s.study}/3 evening classes. Complete the course for +$140 annual salary.`}</p></div><div class="block"><h3>Mara Novak <span style="float:right;font-weight:400">${s.bond}/100</span></h3><p>Your coworker. Knows who needs help and who keeps their word.</p><div class="track"><i style="width:${s.bond}%"></i></div>${s.promise?`<span class="chip">Promise: help her move in ${1961+s.promise.due}</span>`:s.promiseDone?'<span class="chip">She remembers: you showed up.</span>':'<p>Spend time together to hear what is happening in her life.</p>'}${s.heat?`<p style="color:var(--red)">Bureau attention: ${s.heat}/100. It cools by 10 each year.</p>`:''}</div>`;
 $('record').innerHTML=s.records.length?s.records.slice(0,5).map(r=>`<div class="entry"><strong>${1961+r.year}</strong> &nbsp; ${r.text}</div>`).join(''):'<div class="entry">Your file is open. The next entry is yours.</div>';
}
function dialog(kicker,title,body,options){lastFocus=document.activeElement;modal=true;render();$('dialog').innerHTML=`<div class="small">${kicker}</div><h2 id="dialogTitle">${title}</h2>${body}<div class="choices">${options.map((o,i)=>`<button class="choice ${i?'alt':''}" data-choice="${i}"><b>${o.label}</b>${o.note?`<span>${o.note}</span>`:''}</button>`).join('')}</div>`;$('overlay').hidden=false;$('dialog').onclick=e=>{const b=e.target.closest('[data-choice]');if(!b||b.disabled)return;const opt=options[Number(b.dataset.choice)];closeDialog();opt.run();};$('dialog').querySelector('button').focus();}
function closeDialog(){modal=false;$('overlay').hidden=true;render();if(lastFocus&&lastFocus.isConnected&&!lastFocus.disabled)lastFocus.focus();else $('endYear').focus();}
function act(id){
 if(id==='risk'&&s.op&&!modal&&!s.ended){operation();return;}if(!ready(id))return;
 if(id==='work'){if(s.health<15)return;spend(id);const pay=workPay();s.cash+=pay;s.health=clamp(s.health-workStrain());s.mood=clamp(s.mood-3);add(`Extra shift: +${money(pay)}. Health −${workStrain()}; happiness −3. Your regular salary is still due at year end.`);}
 if(id==='learn'){if(s.trained||s.cash<learnCost())return;spend(id);s.cash-=learnCost();s.study++;if(s.study===3){s.trained=true;add('Three classes, one qualification. You are a skilled fitter. Salary rises from $420 to $560, starting this year.');}else add(`Evening class ${s.study}/3 complete. Tuition −${money(learnCost())}. ${3-s.study} more ${s.study===2?'class':'classes'} to qualify.`);}
 if(id==='recover'){spend(id);s.health=clamp(s.health+16);s.mood=clamp(s.mood+10);add('A day that belongs to you. Health +16; happiness +10. No appointment, no bill.');}
 if(id==='connect'){spend(id);if(s.promise&&s.promise.due===s.year){s.bond=clamp(s.bond+20);s.mood=clamp(s.mood+5);s.promise=null;s.promiseDone=true;s.helped=true;add('You carried the boxes. Mara kept her word too: an introduction earns you a paid responsibility. Bond +20; annual salary +$30.');}else{s.bond=clamp(s.bond+connectGain());s.mood=clamp(s.mood+6);add('You and Mara share supper after the shift. Bond +${connectGain()}; happiness +6.');if(!s.promise&&!s.promiseDone&&s.year<5&&!s.helped){render();dialog('A person, not a progress bar','“Could you help next year?”','<p>Mara has found a better flat. She needs help moving. Nothing is owed unless you give your word.</p>',[{label:'Promise to help',note:'Next year: spend 1 Connect action. Keep it for +20 bond and a job introduction; break it for −18 bond.',run:()=>{s.promise={due:s.year+1};add(`You promise to help Mara move in ${1962+s.year}. She is counting on you.`);render();}},{label:'Be honest: I cannot promise',note:'Keep today’s friendship gain. No obligation.',run:()=>{add('You enjoy the evening without making a promise you may not keep.');render();}}]);return;}}}
 if(id==='risk'){if(s.cash<40)return;spend(id);s.cash-=40;if(rng()<firstRiskOdds()){s.op={stage:1,pot:90};add('The first delivery is through. $90 waits in the envelope. It is yours only when you cash out.');render();operation();return;}else{s.heat=clamp(s.heat+12);add('The handoff failed. The $40 stake is gone; attention +12. Your other savings are untouched.',true);}}
 render();
}
function cashout(){if(!s.op)return;const n=s.op.pot;s.cash+=n;s.op=null;add(`Cashed out ${money(n)}. The envelope is in your pocket. No action spent to stop.`);render();}
function operation(){
 if(!s.op||s.ended)return;const stage=s.op.stage,p=s.op.pot,next=stage===1?180:350,odds=(stage===1?.70:.50)*(s.heat>=40?.8:1);
 const options=[{label:`Cash out ${money(p)}`,note:'Guaranteed. No action cost. Close this operation for the year.',run:cashout}];
 if(stage<3&&s.ap>0)options.push({label:`Continue for ${money(next)}`,note:`1 action / ${Math.round(odds*100)}% success. Failure loses the pending ${money(p)}, costs 5 health and adds 18 attention.`,run:()=>{if(!s.op||s.ap<1)return;s.ap--;if(rng()<odds){s.op.stage++;s.op.pot=next;add(`Delivery ${s.op.stage} cleared. Pending envelope: ${money(next)}.`);render();operation();}else{s.op=null;s.health=clamp(s.health-5);s.heat=clamp(s.heat+18);add(`A checkpoint ended the operation. Pending ${money(p)} lost; health −5; attention +18. Other savings are safe.`,true);render();}}});
 dialog('Off the books / delivery '+stage,'Walk away, or push your luck?',`<p>A fixer has another parcel. There is always another parcel.</p><div class="bigmoney">${money(p)}</div><p>Pending payout, not yet in your savings.${stage===3?' Three stages complete. Cash out.':s.ap===0?' No actions remain. Cash out.':s.heat>=40?' The Bureau is watching; your odds are lower.':''}</p>`,options);
}

function endYear(){
 if(modal||s.ended)return;
 if(s.promise&&s.promise.due===s.year){
  dialog('Before you close the year','Mara is still waiting.','<p>You promised to help her move. '+(s.ap&&!s.used.includes('connect')?'You can still spend a Connect action.':'You have no Connect action available.')+' Ending now breaks the promise: bond −18.</p>',[
   {label:'Return to the year',run:()=>render()},
   {label:'End anyway',note:'Accept the consequence.',run:()=>settle()}
  ]);
  return;
 }
 settle();
}
function settle(){
 const y=s.year;
 let opMoney=0;if(s.op){opMoney=s.op.pot;s.cash+=opMoney;s.op=null;}
 let broken=false;if(s.promise&&s.promise.due===y){s.bond=clamp(s.bond-18);s.promise=null;s.promiseDone=true;broken=true;}
 const income=salary(),costs=livingCost(),net=income-costs;
 s.cash+=net;s.health=clamp(s.health-3);s.mood=clamp(s.mood-2);s.heat=clamp(s.heat-10);
 s.receipt={year:y,income,costs,net,opMoney,cash:s.cash,broken};
 add('Year '+(1961+y)+' settled: salary +'+money(income)+', rent & food −'+money(costs)+'.'+(opMoney?' Envelope banked +'+money(opMoney)+'.':'')+(broken?' You did not show up for Mara. Bond −18.':'')+' Health −3; happiness −2.',broken);
 if(y===5){
  s.ended=true;render();
  const goals=checkGoals(),n=goals.filter(Boolean).length;
  const body='<div class="receipt"><div class="inline"><span>Regular salary</span><b>+'+money(income)+'</b></div><div class="inline"><span>Rent & food</span><b>−'+money(costs)+'</b></div>'+(opMoney?'<div class="inline"><span>Envelope banked</span><b>+'+money(opMoney)+'</b></div>':'')+'<div class="inline"><span>Cash on file</span><b>'+money(s.cash)+'</b></div></div><p>Health −3; happiness −2 from the passing year.'+(broken?' Mara remembers the empty doorstep. Bond −18.':'')+'</p>';
  dialog('Chapter filed / 1966',n===3?'A future you built.':n===2?'Two things worth keeping.':n===1?'A beginning, not a verdict.':'Five years changed you.',body+'<p>'+n+'/3 ambitions achieved. '+(s.trained?'You leave with a qualification. ':'')+(s.bond>=65?'Mara is a real friend. ':'')+(s.cash>=650?'Your savings offer breathing room.':'')+'</p><p>Your choices made this file. Another approach will make a different one.</p>',[
   {label:'Try a new file',run:reset},{label:'Review my record',run:()=>render()}
  ]);
  return;
 }
 s.year++;s.ap=3;s.used=[];render();
}

$('actions').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action);});$('endYear').onclick=endYear;
$('restart').onclick=()=>{if(modal)return;dialog('New file','Start again?', '<p>This closes the current prototype run. The page does not save your progress.</p>',[{label:'Keep playing',run:()=>render()},{label:'Start a new file',run:reset}]);};
document.addEventListener('keydown',e=>{if(!modal||e.key!=='Tab')return;const buttons=[...$('dialog').querySelectorAll('button:not(:disabled)')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
document.addEventListener('keydown',e=>{
 if(modal||s.ended||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
 if(['INPUT','TEXTAREA','SELECT'].includes(e.target&&e.target.tagName))return;
 const ids=['work','learn','connect','recover','risk'];
 if(/^[1-5]$/.test(e.key)){e.preventDefault();act(ids[Number(e.key)-1]);return;}
 if(e.key==='Enter'&&!(e.target&&e.target.closest&&e.target.closest('button'))){e.preventDefault();endYear();}
});
reset();
</script></body></html>
